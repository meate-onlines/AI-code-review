skill: security-no-hardcoded-secrets

cases:
  - name: 硬编码 API key 必须被检出为 critical
    file_path: app/services/openai_client.py
    language: python
    code: |
      import openai

      API_KEY = "sk-abcdef1234567890abcdef1234567890"
      client = openai.OpenAI(api_key=API_KEY)
    expect:
      skill_should_hit: true
      ai_should_find_issue: true
      must_reference_standard: true
      min_severity: critical
      issue_keywords: ["硬编码", "密钥", "环境变量", "API"]

  - name: Java 中硬编码密码必须被检出
    file_path: src/main/java/com/foo/Db.java
    code: |
      package com.foo;

      public class Db {
          private static final String PWD = "Prod@2025!";
          public static String get() { return PWD; }
      }
    expect:
      skill_should_hit: true
      ai_should_find_issue: true
      must_reference_standard: true
      min_severity: critical
      issue_keywords: ["硬编码", "密码", "环境变量", "配置"]

  - name: 从环境变量读取的合规写法不应误报
    file_path: app/services/clean_client.py
    language: python
    code: |
      import os

      API_KEY = os.environ["OPENAI_API_KEY"]
    expect:
      skill_should_hit: true
      ai_should_find_issue: false
      must_reference_standard: true

  - name: Markdown 文件应被 path_excludes 排除
    file_path: docs/setup.md
    language: markdown
    code: |
      # Setup
      Set API_KEY environment variable like this:
      `export API_KEY=sk-xxx`
    expect:
      skill_should_hit: false
